<head>

<title>Cut for Time - DC Sketchfest</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/img/brand/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<main class="error-page">
  <div class="error-inner">
    <p class="error-slate">404 &middot; Page not found</p>
    <h1 class="h-xl text-white">Cut for time</h1>

    <!-- The default line is server-rendered so it still reads with JS off;
         the script below swaps in a random one. -->
    <p class="error-punchline" id="punchline">It killed at the table read.</p>

    <img class="error-mumbie" src="/assets/img/characters/mumbie-side.avif"
         alt="Mumbie the Mumbo Sauce, looking sheepish" loading="eager" width="220" height="143">

    <div class="btn-row">
      <a class="btn" href="/"><span>Back to Home</span></a>
      <a class="btn btn--purple" href="/apply/"><span>Apply for 2027</span></a>
    </div>
  </div>
</main>

<script>
  // A comedy festival's 404 may as well have more than one joke in it.
  var lines = [
    "It killed at the table read.",
    "It got cut in rewrites.",
    "The blackout came a little early on this one.",
    "It was funnier in the pitch meeting.",
    "Tech never got the cue.",
    "Notes just said “maybe next year.”",
    "It ran long. Everything runs long.",
    "Wrong link. Right instinct.",
    "This page is doing crowd work somewhere else."
  ];
  var el = document.getElementById("punchline");
  if (el) el.textContent = lines[Math.floor(Math.random() * lines.length)];
</script>
</body>
</html>
