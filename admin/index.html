<!DOCTYPE html>

<title>Admin - DC Sketchfest</title>
<meta name="robots" content="noindex, nofollow">
<!-- A signpost, not the admin itself. The real thing is served by the Worker,
     which is the only half of this festival's stack that can check who you
     are; GitHub Pages serves every byte it has to anyone who asks, so an
     applicant list could not live here whatever the URL said.

     Fires before the meta refresh and leaves no history entry, so Back returns
     where the visitor came from rather than bouncing them out again. -->
<meta http-equiv="refresh" content="0; url=https://dcsketchfest-app.walker-df2.workers.dev/">
<script>location.replace("https://dcsketchfest-app.walker-df2.workers.dev/");</script>
</head>
